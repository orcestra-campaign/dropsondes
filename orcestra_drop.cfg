[MANDATORY]
data_directory = ./dropsonde_data/raw/

[OPTIONAL]
path_to_flight_ids = ./dropsonde_data/raw/
path_to_l0_files = {flight_id}/
platforms = HALO
platform_directory_names = .
product_dir = ./dropsonde_data/products/

broken_sonde_file = broken_sondes.txt

[GLOBAL_ATTRS]
title = Dropsonde data from the ORCESTRA field campaign
institution = PERCUSION subcampaign of ORCESTRA 2024
source = dropsonde and postprocessing using pydropsonde
references = https://orcestra-campaign.org/orcestra.html,https://github.com/atmdrops/pydropsonde
authors = Helene Gloeckner, Theresa Mieslinger, Nina Robbins
contact_email = helene.gloeckner@mpimet.mpg.de


[processor.Sonde.add_flight_id]
flight_template = {flight_id}

[processor.Sonde.add_level_dir]
l1_dir = ./dropsonde_data/products/Level_1/{flight_id}
l2_dir = ./dropsonde_data/products/Level_2/{flight_id}


[processor.Sonde.get_l2_filename]
l2_filename_template = PERCUSION_{serial_id}_Level_2.zarr
[processor.Sonde.check_interim_l3]
interim_l3_filename = interim_l3_{sonde_id}_{version}.zarr

[processor.Sonde.replace_alt_dim]
drop_nan=True

[processor.Sonde.set_alt_dim]
alt_dim=gpsalt


[processor.Gridded.get_l3_dir]
l3_dir = ./dropsonde_data/products/Level_3/


[processor.Gridded.get_l3_filename]
l3_filename = PERCUSION_Level_3.zarr

[processor.Gridded.get_simple_circle_times_from_yaml]
yaml_file = ./dropsonde_data/example_segments.yml
